<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-label="Radar Bandi: notifica sul telefono senza nomi e scheda del bando nell'app con i clienti adatti">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2350"/>
      <stop offset="1" stop-color="#1a4fa8"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2b4f8f"/>
      <stop offset="1" stop-color="#0d1f42"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="720" height="560" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- App window -->
    <g filter="url(#sh)">
      <rect x="196" y="56" width="488" height="448" rx="18" fill="#f6f9fd"/>
    </g>
    <rect x="196" y="56" width="488" height="44" rx="18" fill="#ffffff"/>
    <rect x="196" y="82" width="488" height="18" fill="#ffffff"/>
    <circle cx="220" cy="78" r="5" fill="#d9e2ef"/><circle cx="238" cy="78" r="5" fill="#d9e2ef"/><circle cx="256" cy="78" r="5" fill="#d9e2ef"/>
    <text x="440" y="83" font-size="13" font-weight="700" fill="#0f1d33" text-anchor="middle">Radar Bandi</text>
    <rect x="388" y="122" width="270" height="22" rx="11" fill="#fcefd3"/>
    <text x="400" y="138" font-size="12" font-weight="700" fill="#9a6400">Scade tra 12 giorni</text>
    <text x="388" y="172" font-size="17" font-weight="700" fill="#0f1d33">Energia Imprese:</text>
    <text x="388" y="194" font-size="17" font-weight="700" fill="#0f1d33">fotovoltaico ed efficienza</text>
    <text x="388" y="216" font-size="13" fill="#5b6b82">Regione Lombardia · fondo perduto</text>
    <rect x="388" y="236" width="270" height="118" rx="12" fill="#ffffff" stroke="#d9e2ef"/>
    <circle cx="414" cy="264" r="16" fill="none" stroke="#e0ebfd" stroke-width="5"/>
    <path d="M414 248 A16 16 0 1 1 401 273" fill="none" stroke="#1565d8" stroke-width="5" stroke-linecap="round"/>
    <text x="414" y="268" font-size="11" font-weight="700" fill="#0f1d33" text-anchor="middle">90</text>
    <text x="440" y="261" font-size="13" font-weight="700" fill="#0f1d33">Officina Rossi</text>
    <text x="440" y="279" font-size="11" fill="#1565d8" font-weight="700">Ammissibile</text>
    <text x="402" y="306" font-size="12" fill="#4a5870">Il fotovoltaico sul capannone è</text>
    <text x="402" y="322" font-size="12" fill="#4a5870">tra gli interventi ammessi.</text>
    <text x="402" y="342" font-size="12" fill="#9a6400">Da verificare: diagnosi energetica</text>
    <rect x="388" y="370" width="270" height="70" rx="12" fill="#ffffff" stroke="#d9e2ef"/>
    <circle cx="414" cy="398" r="16" fill="none" stroke="#e0ebfd" stroke-width="5"/>
    <path d="M414 382 A16 16 0 1 1 398 393" fill="none" stroke="#1565d8" stroke-width="5" stroke-linecap="round"/>
    <text x="414" y="402" font-size="11" font-weight="700" fill="#0f1d33" text-anchor="middle">81</text>
    <text x="440" y="395" font-size="13" font-weight="700" fill="#0f1d33">Tessitura Colombo</text>
    <text x="440" y="413" font-size="11" fill="#9a6400" font-weight="700">Da verificare</text>
    <rect x="388" y="456" width="150" height="30" rx="8" fill="#1565d8"/>
    <text x="463" y="476" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Ricordamelo</text>

    <!-- Phone -->
    <g filter="url(#sh)">
      <rect x="36" y="78" width="250" height="440" rx="38" fill="#0b0f17"/>
    </g>
    <rect x="46" y="88" width="230" height="420" rx="30" fill="url(#scr)"/>
    <rect x="131" y="98" width="60" height="16" rx="8" fill="#0b0f17"/>
    <text x="161" y="182" font-size="50" font-weight="600" fill="#eef4ff" text-anchor="middle">8:02</text>
    <text x="161" y="206" font-size="12" fill="#b4cbee" text-anchor="middle">lunedì 19 ottobre</text>
    <rect x="58" y="236" width="206" height="78" rx="16" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="68" y="248" width="26" height="26" rx="7" fill="#1a4fa8"/>
    <circle cx="86" cy="256" r="3.5" fill="#ffd479"/>
    <text x="102" y="258" font-size="9" fill="#5b6b82">RADAR BANDI · ora</text>
    <text x="102" y="276" font-size="12" font-weight="700" fill="#0f1d33">3 nuovi bandi per</text>
    <text x="102" y="292" font-size="12" font-weight="700" fill="#0f1d33">i tuoi clienti</text>
    <text x="102" y="306" font-size="10" fill="#4a5870">Apri l'app per i dettagli</text>
    <rect x="58" y="324" width="206" height="62" rx="16" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="68" y="336" width="26" height="26" rx="7" fill="#1a4fa8"/>
    <circle cx="86" cy="344" r="3.5" fill="#ffd479"/>
    <text x="102" y="346" font-size="9" fill="#5b6b82">RADAR BANDI · 8:00</text>
    <text x="102" y="363" font-size="12" font-weight="700" fill="#0f1d33">Riepilogo settimanale</text>
    <text x="102" y="378" font-size="10" fill="#4a5870">5 scadenze in 30 giorni</text>
    <text x="161" y="478" font-size="11" fill="#b4cbee" text-anchor="middle">Nessun nome nelle notifiche</text>
    <text x="684" y="536" font-size="12" fill="#a9c3ea" text-anchor="end">dati di esempio</text>
  </g>
</svg>
